# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      labels:
          - dependencies
      ignore:
          # Keep @types/vscode at the engines.vscode floor (Cursor cap, see vscode-engine-cursor-cap).
          - dependency-name: '@types/vscode'
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      labels:
          - dependencies
          - github-action
